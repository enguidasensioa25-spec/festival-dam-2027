<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival DAM 2027 - Entradas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Festival DAM 2027</h1>
        <p class="fechas">18 y 19 de junio de 2027</p>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="programa.html">Programa</a></li>
                <li><a href="entradas.html" class="activo">Entradas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Venta de Entradas</h2>

        <section class="tarjeta-entrada">
            <h3>Entrada General de un día</h3>
            <p class="precio">25 €</p>
            <p>Acceso general al recinto durante una jornada completa (viernes 18 o sábado 19 de junio).</p>
        </section>

        <section class="formulario-compra">
            <h3>Reserva tu entrada</h3>
            <form action="#" method="post">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Laura García">

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">

                <label for="dia">Selecciona el día:</label>
                <select id="dia" name="dia">
                    <option value="viernes">Viernes 18 de junio - 25 €</option>
                    <option value="sabado">Sábado 19 de junio - 25 €</option>
                </select>

                <label for="cantidad">Cantidad de entradas:</label>
                <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1" required>

                <button type="submit" class="boton">Reservar entrada</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2027 Festival DAM. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
